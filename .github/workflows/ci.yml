name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # Windows has no system time zone database. On Linux and macOS tzdata stays
      # uninstalled, so the missing-tzdata hint test runs there.
      - if: runner.os == 'Windows'
        run: python -m pip install tzdata
      - run: python -m unittest discover -s tests -v
